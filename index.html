<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 رفع وتشغيل 10+ لغة برمجية</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #161b22;
            padding: 40px;
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            border: 1px solid #30363d;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
            color: #58a6ff;
        }
        .sub {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .badge-lang {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin: 2px;
            background: #1f6feb;
            color: white;
        }
        .upload-area {
            border: 2px dashed #30363d;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #0d1117;
        }
        .upload-area:hover {
            border-color: #58a6ff;
            background: #161b22;
        }
        .upload-area input { display: none; }
        .upload-area label {
            cursor: pointer;
            font-size: 16px;
            color: #58a6ff;
        }
        .upload-area label span { font-size: 48px; display: block; margin-bottom: 8px; }
        #fileList { margin-top: 20px; }
        .file-item {
            background: #0d1117;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #21262d;
            flex-wrap: wrap;
            gap: 8px;
        }
        .file-item .name { font-weight: bold; color: #f0f6fc; font-size: 14px; }
        .file-item .size { color: #8b949e; font-size: 12px; margin-right: 8px; }
        .file-item .lang { font-size: 11px; padding: 2px 10px; border-radius: 12px; background: #1f6feb; color: white; }
        .btn {
            background: #238636;
            border: none;
            color: white;
            padding: 5px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn:hover { background: #2ea043; }
        .btn-danger { background: #da3633; }
        .btn-danger:hover { background: #f85149; }
        .btn-secondary { background: #21262d; }
        .btn-secondary:hover { background: #30363d; }
        #output {
            margin-top: 20px;
            background: #0d1117;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: none;
            max-height: 500px;
            overflow: auto;
        }
        #output.active { display: block; }
        #output iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 6px;
            background: white;
        }
        #output pre {
            background: #161b22;
            padding: 14px;
            border-radius: 6px;
            overflow: auto;
            color: #f0f6fc;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            margin: 0;
        }
        .url-box {
            background: #0d1117;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-top: 10px;
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .url-box input {
            background: transparent;
            border: none;
            color: #58a6ff;
            width: 100%;
            font-size: 13px;
            outline: none;
            flex: 1;
        }
        .url-box button {
            background: #1f6feb;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .url-box button:hover { background: #388bfd; }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #8b949e;
            font-size: 12px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 10px 0 15px;
            font-size: 13px;
            color: #8b949e;
        }
        .stats span { background: #0d1117; padding: 4px 14px; border-radius: 20px; border: 1px solid #21262d; }
        .tab-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 10px;
        }
        .tab-bar .btn {
            background: #21262d;
            font-size: 12px;
            padding: 4px 12px;
        }
        .tab-bar .btn.active-tab { background: #1f6feb; }
    </style>
</head>
<body>

<div class="container">
    <h1>📂 رفع وتشغيل 10+ لغة</h1>
    <p class="sub">ارفع أي ملف وسيتم تشغيله تلقائياً مع رابط مباشر</p>

    <div class="stats">
        <span>✅ يدعم: HTML • JS • TS • PY • PHP • CSS • JSON • XML • SQL • SH • TXT • صور</span>
    </div>

    <div class="upload-area" id="dropZone">
        <input type="file" id="fileInput" multiple>
        <label for="fileInput">
            <span>📤</span>
            <strong>اضغط للرفع أو اسحب الملفات</strong><br>
            <span style="font-size:13px;color:#8b949e;">يدعم جميع الامتدادات</span>
        </label>
    </div>

    <div id="fileList"></div>

    <div id="output">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
            <span style="font-weight:bold;">📺 نتيجة التشغيل</span>
            <div style="display:flex;gap:6px;">
                <button class="btn btn-secondary" onclick="downloadOutput()" style="font-size:12px;">💾 تحميل</button>
                <button class="btn btn-danger" onclick="clearOutput()" style="font-size:12px;">✕ إغلاق</button>
            </div>
        </div>
        <div id="outputContent"></div>
        <div class="url-box" id="urlBox">
            <input type="text" id="fileUrl" readonly>
            <button onclick="copyUrl()">📋 نسخ</button>
            <button onclick="openUrl()" style="background:#238636;">🔗 فتح</button>
        </div>
    </div>

    <div class="footer">
        🔗 جميع الملفات تعمل محلياً · يدعم 10+ لغة برمجية
    </div>
</div>

<script>
    // ====== المتغيرات ======
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileList = document.getElementById('fileList');
    const output = document.getElementById('output');
    const outputContent = document.getElementById('outputContent');
    const urlBox = document.getElementById('urlBox');
    const fileUrl = document.getElementById('fileUrl');

    let uploadedFiles = [];
    let currentOutputBlob = null;

    // ====== تعريف اللغات المدعومة ======
    const LANG_MAP = {
        'html': { name: 'HTML', icon: '🌐', exec: 'html' },
        'htm': { name: 'HTML', icon: '🌐', exec: 'html' },
        'js': { name: 'JavaScript', icon: '⚡', exec: 'js' },
        'ts': { name: 'TypeScript', icon: '🔷', exec: 'ts' },
        'py': { name: 'Python', icon: '🐍', exec: 'py' },
        'php': { name: 'PHP', icon: '🐘', exec: 'php' },
        'css': { name: 'CSS', icon: '🎨', exec: 'css' },
        'json': { name: 'JSON', icon: '📋', exec: 'json' },
        'xml': { name: 'XML', icon: '📄', exec: 'xml' },
        'sql': { name: 'SQL', icon: '🗄️', exec: 'sql' },
        'sh': { name: 'Shell', icon: '💻', exec: 'sh' },
        'bash': { name: 'Bash', icon: '💻', exec: 'sh' },
        'txt': { name: 'نص', icon: '📄', exec: 'txt' },
        'log': { name: 'Log', icon: '📄', exec: 'txt' },
        'md': { name: 'Markdown', icon: '📝', exec: 'md' },
        'png': { name: 'صورة', icon: '🖼️', exec: 'image' },
        'jpg': { name: 'صورة', icon: '🖼️', exec: 'image' },
        'jpeg': { name: 'صورة', icon: '🖼️', exec: 'image' },
        'gif': { name: 'صورة', icon: '🖼️', exec: 'image' },
        'svg': { name: 'صورة', icon: '🖼️', exec: 'image' },
        'webp': { name: 'صورة', icon: '🖼️', exec: 'image' },
        'bmp': { name: 'صورة', icon: '🖼️', exec: 'image' },
        'ico': { name: 'أيقونة', icon: '🖼️', exec: 'image' }
    };

    // ====== رفع الملفات ======
    function handleFiles(files) {
        for (let file of files) {
            if (!uploadedFiles.find(f => f.name === file.name && f.size === file.size)) {
                uploadedFiles.push(file);
            }
        }
        renderFileList();
    }

    // ====== عرض القائمة ======
    function renderFileList() {
        if (uploadedFiles.length === 0) {
            fileList.innerHTML = '<div style="text-align:center;color:#8b949e;padding:20px;">📭 لا توجد ملفات مرفوعة</div>';
            return;
        }
        fileList.innerHTML = uploadedFiles.map((file, index) => {
            const size = (file.size / 1024).toFixed(1) + ' KB';
            const ext = file.name.split('.').pop().toLowerCase();
            const lang = LANG_MAP[ext] || { name: ext.toUpperCase(), icon: '📎', exec: 'unknown' };
            const sizeDisplay = file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+' MB' : size;

            return `
                <div class="file-item">
                    <div>
                        <span class="name">${lang.icon} ${file.name}</span>
                        <span class="lang">${lang.name}</span>
                        <span class="size">${sizeDisplay}</span>
                    </div>
                    <div>
                        <button class="btn" onclick="runFile(${index})">▶ تشغيل</button>
                        <button class="btn btn-danger" onclick="removeFile(${index})" style="margin-left:4px;">✕</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ====== حذف ======
    function removeFile(index) {
        uploadedFiles.splice(index, 1);
        renderFileList();
        if (uploadedFiles.length === 0) output.classList.remove('active');
    }

    // ====== تشغيل الملف ======
    function runFile(index) {
        const file = uploadedFiles[index];
        if (!file) return;

        const reader = new FileReader();
        const ext = file.name.split('.').pop().toLowerCase();
        const lang = LANG_MAP[ext] || { name: 'غير معروف', icon: '📎', exec: 'unknown' };
        const execType = lang.exec;

        reader.onload = function(e) {
            const content = e.target.result;
            let html = '';
            let url = '';
            currentOutputBlob = null;

            switch(execType) {
                // ====== HTML ======
                case 'html':
                    const blob = new Blob([content], { type: 'text/html' });
                    url = URL.createObjectURL(blob);
                    currentOutputBlob = blob;
                    html = `<iframe src="${url}" style="width:100%;height:400px;border:none;border-radius:6px;background:white;"></iframe>`;
                    break;

                // ====== JavaScript ======
                case 'js':
                    try {
                        let logs = [];
                        const originalLog = console.log;
                        console.log = function(...args) {
                            logs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' '));
                            originalLog.apply(console, args);
                        };
                        const result = eval(content);
                        console.log = originalLog;
                        const outputText = logs.length ? logs.join('\n') : (result !== undefined ? String(result) : '✅ تم التنفيذ بنجاح');
                        html = `<pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f0f6fc;font-size:13px;">${escapeHtml(outputText)}</pre>`;
                    } catch(err) {
                        html = `<pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f85149;">❌ خطأ: ${escapeHtml(err.message)}</pre>`;
                    }
                    break;

                // ====== TypeScript ======
                case 'ts':
                    // نعالجه كـ JS مع تنبيه
                    try {
                        // نحاول تنفيذه مباشرة (قد ينجح لو JS خالص)
                        let logs = [];
                        const originalLog = console.log;
                        console.log = function(...args) {
                            logs.push(args.join(' '));
                            originalLog.apply(console, args);
                        };
                        const result = eval(content);
                        console.log = originalLog;
                        const outputText = logs.length ? logs.join('\n') : (result !== undefined ? String(result) : '✅ تم التنفيذ (كـ JavaScript)');
                        html = `
                            <div style="background:#1f6feb20;padding:12px;border-radius:6px;border:1px solid #1f6feb;margin-bottom:10px;">
                                ⚠️ تم تنفيذ الملف كـ JavaScript (TypeScript يحتاج مترجم)
                            </div>
                            <pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f0f6fc;font-size:13px;">${escapeHtml(outputText)}</pre>
                        `;
                    } catch(err) {
                        html = `<pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f85149;">❌ خطأ في تنفيذ TypeScript: ${escapeHtml(err.message)}</pre>`;
                    }
                    break;

                // ====== Python ======
                case 'py':
                    // محاكاة بسيطة (طباعة النصوص)
                    try {
                        // نبحث عن print statements
                        const lines = content.split('\n');
                        let outputLines = [];
                        for (let line of lines) {
                            const match = line.match(/print\s*\(['"](.*?)['"]\)/);
                            if (match) outputLines.push(match[1]);
                            // محاكاة متغيرات بسيطة
                            const varMatch = line.match(/^(\w+)\s*=\s*['"](.*?)['"]/);
                            if (varMatch) outputLines.push(`${varMatch[1]} = "${varMatch[2]}"`);
                        }
                        if (outputLines.length) {
                            html = `<pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f0f6fc;font-size:13px;">${escapeHtml(outputLines.join('\n'))}</pre>`;
                        } else {
                            html = `<pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f0f6fc;">✅ تم تحليل ملف Python (محاكاة)\n${escapeHtml(content.substring(0, 300))}${content.length>300?'...':''}</pre>`;
                        }
                    } catch(err) {
                        html = `<pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f85149;">❌ خطأ: ${escapeHtml(err.message)}</pre>`;
                    }
                    break;

                // ====== PHP ======
                case 'php':
                    html = `
                        <div style="background:#1f6feb20;padding:12px;border-radius:6px;border:1px solid #1f6feb;margin-bottom:10px;">
                            ⚠️ PHP يحتاج سيرفر خارجي، لكن يمكنك عرض الكود:
                        </div>
                        <pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f0f6fc;font-size:13px;">${escapeHtml(content)}</pre>
                    `;
                    break;

                // ====== CSS ======
                case 'css':
                    html = `
                        <div style="background:#161b22;padding:20px;border-radius:8px;">
                            <style>${content}</style>
                            <h3 style="color:#58a6ff;">✅ تم تطبيق CSS</h3>
                            <div style="background:#0d1117;padding:16px;border-radius:6px;border:1px solid #30363d;">
                                <p style="color:#e6edf3;">هذا نص تجريبي</p>
                                <button style="background:#238636;border:none;color:white;padding:8px 20px;border-radius:6px;cursor:pointer;">زر</button>
                            </div>
                            <details style="margin-top:12px;">
                                <summary style="cursor:pointer;color:#8b949e;">📄 عرض الكود</summary>
                                <pre style="background:#0d1117;padding:12px;border-radius:6px;color:#f0f6fc;font-size:13px;overflow:auto;">${escapeHtml(content)}</pre>
                            </details>
                        </div>
                    `;
                    break;

                // ====== JSON ======
                case 'json':
                    try {
                        const parsed = JSON.parse(content);
                        html = `
                            <div style="background:#161b22;padding:16px;border-radius:6px;">
                                <h4 style="color:#58a6ff;margin:0 0 10px;">✅ JSON صحيح</h4>
                                <pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f0f6fc;font-size:13px;overflow:auto;">${escapeHtml(JSON.stringify(parsed, null, 2))}</pre>
                            </div>
                        `;
                    } catch(err) {
                        html = `<pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f85149;">❌ JSON غير صحيح: ${escapeHtml(err.message)}</pre>`;
                    }
                    break;

                // ====== XML, SQL, Shell, TXT, MD ======
                case 'xml':
                case 'sql':
                case 'sh':
                case 'txt':
                case 'md':
                    const label = { 'xml':'XML', 'sql':'SQL', 'sh':'Shell Script', 'txt':'نص', 'md':'Markdown' }[execType] || 'ملف';
                    html = `
                        <div style="background:#1f6feb20;padding:8px 12px;border-radius:6px;margin-bottom:10px;border:1px solid #1f6feb;">
                            📄 ملف ${label}
                        </div>
                        <pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f0f6fc;font-size:13px;overflow:auto;max-height:400px;">${escapeHtml(content)}</pre>
                    `;
                    break;

                // ====== الصور ======
                case 'image':
                    const imgBlob = new Blob([content], { type: file.type });
                    url = URL.createObjectURL(imgBlob);
                    currentOutputBlob = imgBlob;
                    html = `<img src="${url}" style="max-width:100%;max-height:450px;border-radius:8px;display:block;margin:0 auto;">`;
                    break;

                // ====== غير معروف ======
                default:
                    html = `
                        <div style="background:#da363320;padding:12px;border-radius:6px;border:1px solid #da3633;margin-bottom:10px;">
                            ⚠️ لا يمكن تشغيل هذا النوع، لكن يمكنك عرض المحتوى:
                        </div>
                        <pre style="background:#0d1117;padding:16px;border-radius:6px;color:#f0f6fc;font-size:13px;max-height:300px;overflow:auto;">${escapeHtml(content)}</pre>
                    `;
            }

            // عرض النتيجة
            output.classList.add('active');
            outputContent.innerHTML = html;

            // عرض الرابط
            if (url) {
                urlBox.style.display = 'flex';
                fileUrl.value = url;
            } else {
                urlBox.style.display = 'none';
            }
        };

        // قراءة الملف حسب النوع
        if (['image', 'html'].includes(execType) && 
            ['png','jpg','jpeg','gif','svg','webp','bmp','ico'].includes(ext)) {
            reader.readAsArrayBuffer(file);
        } else {
            reader.readAsText(file);
        }
    }

    // ====== أدوات ======
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function copyUrl() {
        fileUrl.select();
        document.execCommand('copy');
        alert('✅ تم نسخ الرابط');
    }

    function openUrl() {
        if (fileUrl.value) window.open(fileUrl.value, '_blank');
    }

    function clearOutput() {
        output.classList.remove('active');
        outputContent.innerHTML = '';
        urlBox.style.display = 'none';
        if (currentOutputBlob) {
            URL.revokeObjectURL(fileUrl.value);
            currentOutputBlob = null;
        }
    }

    function downloadOutput() {
        const content = outputContent.textContent || '';
        if (content) {
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'output.txt';
            a.click();
        }
    }

    // ====== أحداث السحب ======
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#58a6ff';
        dropZone.style.background = '#161b22';
    });
    dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#30363d';
        dropZone.style.background = '#0d1117';
    });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#30363d';
        dropZone.style.background = '#0d1117';
        if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFiles(e.target.files);
        fileInput.value = '';
    });

    // ====== ملفات تجريبية ======
    window.onload = function() {
        const demos = [
            new File(['<h1 style="color:#58a6ff;">👋 مرحباً!</h1><p>ملف HTML تجريبي</p><button onclick="alert(\'تم!\')" style="background:#238636;border:none;color:white;padding:8px 20px;border-radius:6px;cursor:pointer;">اضغط</button>'], 'demo.html', { type: 'text/html' }),
            new File(['console.log("مرحباً من JavaScript!");\nconst x = 5;\nconsole.log("5 + 3 =", x+3);'], 'script.js', { type: 'text/javascript' }),
            new File(['print("مرحباً من Python")'], 'test.py', { type: 'text/x-python' }),
            new File(['{"name": "اختبار", "version": "1.0"}'], 'data.json', { type: 'application/json' })
        ];
        uploadedFiles = demos;
        renderFileList();
    };
</script>

</body>
</html>
