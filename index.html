<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت سيراف - SERAF Bot</title>
    <!-- استيراد الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* الهيدر */
        header {
            text-align: center;
            padding: 50px 20px 30px;
            max-width: 800px;
        }

        .bot-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #ef4444;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* حاوية الأزرار الرئيسية في الأعلى */
        .header-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-telegram, .btn-chat-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-telegram:hover, .btn-chat-toggle:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(239, 68, 68, 0.5);
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        /* صندوق الدردشة المنبثق */
        .chat-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 380px;
            max-width: 90vw;
            height: 480px;
            background-color: #1e293b;
            border: 2px solid #ef4444;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            transition: all 0.3s ease;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .chat-container.active {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .chat-header {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 15px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
        }

        .chat-header .close-chat {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.bot {
            background-color: #334155;
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background-color: #ef4444;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 10px;
            background-color: #0f172a;
            display: flex;
            gap: 8px;
            border-top: 1px solid #334155;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #1e293b;
            border: 1px solid #475569;
            padding: 10px 15px;
            border-radius: 30px;
            color: white;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input-area input:focus {
            border-color: #ef4444;
        }

        .chat-input-area button {
            background-color: #ef4444;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #dc2626;
        }

        /* قسم الخدمات */
        .container {
            max-width: 1100px;
            width: 90%;
            margin: 40px auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            color: #ef4444;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 10px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        /* بطاقات الخدمات مع الأطر الحمراء المتوهجة */
        .service-card {
            background-color: #1e293b;
            border: 2px solid #ef4444;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.15);
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: #f87171;
            background-color: #273548;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .service-icon {
            font-size: 1.8rem;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .service-info h3 {
            font-size: 1.05rem;
            color: #f1f5f9;
        }

        /* الفوتر */
        footer {
            background-color: #090d16;
            width: 100%;
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid #1e293b;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- الهيدر ومعلومات البوت -->
    <header>
        <div id="botAvatarContainer"></div>
        <h1 id="botName">سيراف - SERAF</h1>
        <p id="botDescription">استمتع بتجربة فريدة مع بوتنا المتطور والمزود بأقوى الخدمات والأدوات الذكية.</p>
        
        <div class="header-buttons">
            <a href="https://t.me/Bot_Swirl_Bot" target="_blank" class="btn-telegram">
                <i class="fa-brands fa-telegram"></i> تجربة البوت الآن
            </a>
            <button class="btn-chat-toggle" onclick="toggleChat()">
                <i class="fa-solid fa-comments"></i> الدردشة مع البوت
            </button>
        </div>
    </header>

    <!-- نافذة الدردشة المنبثقة المربوطة بالـ API الجديد -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <span><i class="fa-solid fa-robot"></i> محادثة بوت سيراف (API)</span>
            <button class="close-chat" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">أهلاً بك! تم ربط الدردشة بنجاح مع سيرفر البوت. اكتب رسالتك وابدأ المحادثة.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- قائمة الخدمات -->
    <div class="container">
        <h2 class="section-title">خدمات البوت المتاحة</h2>
        <div class="services-grid" id="servicesContainer">
            <!-- سيتم تعبئة الخدمات تلقائياً عبر JavaScript -->
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 بوت سيراف (SERAF)</p>
    </footer>

    <!-- كود الجافاسكريبت المحدث للاتصال الفعلي بالـ API -->
    <script>
        const botData = {
            name: "سيراف (SERAF)",
            username: "Bot_Swirl_Bot",
            image: "https://i.ibb.co/Z6NwSjXy/e5fff26ebe26b84d49524c600795f2c0.jpg",
            services: [
                { name: "المساعدة", icon: "fa-solid fa-hands-holding-child" },
                { name: "معلومات البوت", icon: "fa-solid fa-circle-info" },
                { name: "الدعم الفني", icon: "fa-solid fa-headset" },
                { name: "قناة التيليجرام", icon: "fa-solid fa-bullhorn" },
                { name: "شراء API لخدمة AI", icon: "fa-solid fa-key" },
                { name: "اختبار", icon: "fa-solid fa-bolt" },
                { name: "🚀 SERAF", icon: "fa-solid fa-rocket" },
                { name: "المستخدمين", icon: "fa-solid fa-users" },
                { name: "بينج", icon: "fa-solid fa-signal" },
                { name: "ازعاج", icon: "fa-solid fa-volume-high" },
                { name: "بوت SERAF", icon: "fa-solid fa-bullseye" },
                { name: "ارقام وهمية", icon: "fa-solid fa-mobile-screen-button" },
                { name: "اسأل اغبى AI", icon: "fa-solid fa-robot" },
                { name: "ضيفني لقربك", icon: "fa-solid fa-user-plus" },
                { name: "العب XO", icon: "fa-solid fa-gamepad" },
                { name: "العب شطرنج", icon: "fa-solid fa-chess-rook" },
                { name: "سحب ملفات المواقع", icon: "fa-solid fa-folder-open" },
                { name: "فك حظر رقم", icon: "fa-solid fa-lock-open" },
                { name: "فك باند رقم", icon: "fa-solid fa-key" },
                { name: "اكتشاف ثغرات", icon: "fa-solid fa-magnifying-glass" },
                { name: "تشغيل بوت فرعي", icon: "fa-solid fa-rotate" },
                { name: "حسابي", icon: "fa-solid fa-user-gear" },
                { name: "تخمين كلمات المرور", icon: "fa-solid fa-shield-halved" },
                { name: "توليد صوت من نص", icon: "fa-solid fa-music" }
            ]
        };

        function renderBotWebsite() {
            const avatarContainer = document.getElementById('botAvatarContainer');
            avatarContainer.innerHTML = `<img src="${botData.image}" alt="${botData.name}" class="bot-avatar">`;

            const servicesContainer = document.getElementById('servicesContainer');
            let servicesHTML = '';

            botData.services.forEach(service => {
                servicesHTML += `
                    <div class="service-card">
                        <div class="service-icon">
                            <i class="${service.icon}"></i>
                        </div>
                        <div class="service-info">
                            <h3>${service.name}</h3>
                        </div>
                    </div>
                `;
            });

            servicesContainer.innerHTML = servicesHTML;
        }

        function toggleChat() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.classList.toggle('active');
        }

        // دالة إرسال الرسائل والاتصال الفعلي بالـ API الخاص بك
        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (messageText === "") return;

            const chatMessages = document.getElementById('chatMessages');

            // إظهار رسالة المستخدم في الشات
            chatMessages.innerHTML += `<div class="message user">${messageText}</div>`;
            inputField.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // إرسال الطلب عبر fetch باستخدام الـ API والمفتاح الجديد
            fetch('https://sftp.fr-node-35.katabump.com:2022/api/v1/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': 'seraph_60d3431abe1e06b81a9846c81f9ef747'
                },
                body: JSON.stringify({ message: messageText })
            })
            .then(res => res.json())
            .then(data => {
                // استخراج الرد من استجابة السيرفر (توقعنا أن يكون الرد داخل خصائص مثل reply أو response أو message، ويمكن تعديلها حسب شكل بيانات الـ API لديك)
                const botReply = data.reply || data.response || data.message || JSON.stringify(data);
                chatMessages.innerHTML += `<div class="message bot">${botReply}</div>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            })
            .catch(error => {
                console.error('Error:', error);
                chatMessages.innerHTML += `<div class="message bot" style="color: #fca5a5;">عذراً، حدث خطأ أثناء الاتصال بسيرفر البوت. تأكد من عمل السيرفر وصلاحية الاتصال.</div>`;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        window.onload = renderBotWebsite;
    </script>
</body>
</html>
